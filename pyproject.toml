[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saalco"
version = "1.0.0"
description = "Local CLI for operating the SAAL software development rules"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
saalco = "saalco.cli:main"
saal = "saalco.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saalco"]

[tool.hatch.build.targets.wheel.force-include]
"SAAL-DEV-RULES.md" = "saalco/templates/v1/SAAL-DEV-RULES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "verifies(id, spec=None): specification-derived test",
  "impl_aware(id=None): implementation-aware test",
]

[tool.ruff]
line-length = 100
exclude = [".venv", ".uv_cache", "*.md"]
